- type: antag
  id: Hitman
  name: roles-antag-hitman-name
  objective: roles-antag-hitman-objective
  antagonist: true
  setPreference: true
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 24h # works for thief works for me

- type: antagSpecifier
  parent: BaseAntagSpecifier
  id: Hitman
  prefRoles:
  - Hitman
  allowNonHumans: true
  multiAntagSetting: NotExclusive
  startingGear: HitmanGear
  mindRoles:
  - MindRoleHitman
  briefing:
    text: hitman-role-greeting-human
    color: yellow
    sound: /Audio/_DV/Ambience/Antag/hitman_briefing_piano_between.ogg

- type: startingGear
  id: HitmanGear
  storage:
    back:
    - HitmanCase
