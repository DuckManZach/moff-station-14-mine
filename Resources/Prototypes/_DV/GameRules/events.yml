# Hitman (for the admeme spawn)
- type: entity
  parent: BaseGameRule
  id: HitmanRule
  components:
  - type: GameRule
  - type: AntagObjectives
    objectives:
    - EscapeShuttleObjectiveHitman
    - HitmanTeachLessonRandomPersonObjective
  - type: AntagRandomObjectives
    sets:
    - groups: HitmanObjectiveGroup
      maxPicks: 2
  - type: AntagSelection
    agentName: hitman-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: Hitman
      range:
        min: 1
        max: 2
