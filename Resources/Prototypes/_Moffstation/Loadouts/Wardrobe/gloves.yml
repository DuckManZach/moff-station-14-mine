# Color gloves
- type: loadout
  id: !type:CreateVariants
    values: &ColorGloves
    - ClothingHandsGlovesColorGray
    - ClothingHandsGlovesColorBrown
    - ClothingHandsGlovesColorRed
    - ClothingHandsGlovesColorGreen
    - ClothingHandsGlovesColorTeal
    - ClothingHandsGlovesColorBlue
  equipment:
    gloves: !type:CreateVariants
      values: *ColorGloves
  groupBy: "color gloves"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeColorGloves
  loadouts: *ColorGloves

# Other
- type: loadout
  id: !type:CreateVariants
    values: &OtherGloves
    - ClothingHandsGlovesFingerless
  equipment:
    gloves: !type:CreateVariants
      values: *OtherGloves

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeOtherGloves
  loadouts: *OtherGloves

- type: loadoutGroup
  abstract: true
  parent:
  - MoffWardrobeColorGloves
  - MoffWardrobeOtherGloves
  id: MoffWardrobeGloves
  loadouts:
  - TramDriverGlovesBlack
  - TramDriverGlovesWhite
  - OrangeGloves
  - PurpleGloves

- type: loadoutGroup
  parent: MoffWardrobeGloves
  id: MoffWardrobeGlovesOptional
  name: loadout-group-wardrobe-gloves
  minLimit: 0

- type: roleLoadout
  abstract: true
  id: MoffWardrobeGlovesOptional
  groups:
  - MoffWardrobeGlovesOptional
