# Softcaps
- type: loadout
  id: !type:CreateVariants
    values: &Softcaps
    - ClothingHeadHatBlacksoft
    - ClothingHeadHatGreysoft
    - ClothingHeadHatBluesoft
    - ClothingHeadHatGreensoft
    - ClothingHeadHatRedsoft
  slot: head
  groupBy: "softcaps"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeSoftcaps
  loadouts: *Softcaps

