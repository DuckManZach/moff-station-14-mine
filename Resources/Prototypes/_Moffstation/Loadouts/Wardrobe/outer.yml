# Flannel jackets
- type: loadout
  id: !type:CreateVariants
    values: &FlannelJackets
    - ClothingOuterFlannelRed
    - ClothingOuterFlannelBlue
    - ClothingOuterFlannelGreen
  equipment:
    outerClothing: !type:CreateVariants
      values: *FlannelJackets
  groupBy: "flannel jackets"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeFlannelJackets
  loadouts: *FlannelJackets

# Ponchos
- type: loadout
