# Colour shoes
- type: loadout
  id: !type:CreateVariants
    values: &ColourShoes
    - ClothingShoesColorRed
    - ClothingShoesColorOrange
    - ClothingShoesColorYellow
    - ClothingShoesColorGreen
    - ClothingShoesColorPurple
  equipment:
    shoes: !type:CreateVariants
      values: *ColourShoes
  groupBy: "colour shoes"

