# Colour shoes
- type: loadout
  id: !type:CreateVariants
    values: &ColourShoes
    - ClothingShoesColorRed
    - ClothingShoesColorOrange
    - ClothingShoesColorYellow
    - ClothingShoesColorGreen
    - ClothingShoesColorPurple
  slot: shoes
  groupBy: "colour shoes"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeColourShoes
  loadouts: *ColourShoes

# Cowboy boots
- type: loadout
  id: !type:CreateVariants
    values: &CowboyBoots
    - ClothingShoesBootsCowboyBrown
    - ClothingShoesBootsCowboyWhite
  slot: shoes
  groupBy: "cowboy boots"

- type: loadoutGroup
