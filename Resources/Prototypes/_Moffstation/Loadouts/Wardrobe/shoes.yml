# Color shoes
- type: loadout
  id: !type:CreateVariants
    values: &ColorShoes
    - ClothingShoesColorRed
    - ClothingShoesColorOrange
    - ClothingShoesColorYellow
    - ClothingShoesColorGreen
    - ClothingShoesColorPurple
  equipment:
    shoes: !type:CreateVariants
      values: *ColorShoes
  groupBy: "color shoes"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeColorShoes
  loadouts: *ColorShoes

# Cowboy boots
- type: loadout
  id: !type:CreateVariants
    values: &CowboyBoots
    - ClothingShoesBootsCowboyBrown
    - ClothingShoesBootsCowboyWhite
  equipment:
    shoes: !type:CreateVariants
      values: *CowboyBoots
  groupBy: "cowboy boots"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeCowboyBoots
  loadouts: *CowboyBoots

# Novelty socks
- type: loadout
  id: !type:CreateVariants
    values: &NoveltySocks
    - ClothingUnderSocksCoder
    - ClothingUnderSocksBee
  equipment:
    shoes: !type:CreateVariants
      values: *NoveltySocks
  groupBy: "novelty socks"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeNoveltySocks
  loadouts: *NoveltySocks

# Other
- type: loadout
  id: !type:CreateVariants
    values: &OtherShoes
    - ClothingShoesHighheelBoots
    - ClothingShoesDameDane
  equipment:
    shoes: !type:CreateVariants
      values: *OtherShoes

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeOtherShoes
  loadouts: *OtherShoes

- type: loadoutGroup
  abstract: true
  parent:
  - MoffWardrobeColorShoes
  - MoffWardrobeCowboyBoots
  - MoffWardrobeNoveltySocks
  - MoffWardrobeOtherShoes
  id: MoffWardrobeShoes
  loadouts:
  - BlackShoes
  - WhiteShoes
  - BrownShoes
  - BlueShoes
  - CowboyShoes
  - BlackSandals
  - ClownSandals
  - WinterBoots
  - LaceupShoes

- type: loadoutGroup
  parent: MoffWardrobeShoes
  id: MoffWardrobeShoesOptional
  name: loadout-group-wardrobe-shoes
  minLimit: 0

- type: roleLoadout
  abstract: true
  id: MoffWardrobeShoesOptional
  groups:
  - MoffWardrobeShoesOptional

- type: loadoutGroup
  parent: MoffWardrobeShoes
  id: MoffWardrobeShoesBlack
  name: loadout-group-wardrobe-shoes
  loadouts:
  - BlackShoes

- type: loadoutGroup
  parent: MoffWardrobeShoes
  id: MoffWardrobeShoesBrown
  name: loadout-group-wardrobe-shoes
  loadouts:
  - BrownShoes

- type: loadoutGroup
  parent: MoffWardrobeShoes
  id: MoffWardrobeShoesLaceup
  name: loadout-group-wardrobe-shoes
  loadouts:
  - LaceupShoes
