# Color shoes
- type: loadout
  id: !type:CreateVariants
    values: &ColorShoes
    - ClothingShoesColorRed
    - ClothingShoesColorOrange
    - ClothingShoesColorYellow
    - ClothingShoesColorGreen
    - ClothingShoesColorPurple
  slot: shoes
  groupBy: "color shoes"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeColorShoes
  loadouts: *ColorShoes

# Cowboy boots
- type: loadout
  id: !type:CreateVariants
    values: &CowboyBoots
    - ClothingShoesBootsCowboyBrown
    - ClothingShoesBootsCowboyWhite
  slot: shoes
  groupBy: "cowboy boots"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeCowboyBoots
  loadouts: *CowboyBoots

# Novelty socks
- type: loadout
  id: !type:CreateVariants
    values: &NoveltySocks
    - ClothingUnderSocksCoder
    - ClothingUnderSocksBee
  slot: shoes
  groupBy: "novelty socks"

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeNoveltySocks
  loadouts: *NoveltySocks

# Other
- type: loadout
  id: !type:CreateVariants
    values: &OtherShoes
    - ClothingShoesHighheelBoots
    - ClothingShoesDameDane
  slot: shoes

- type: loadoutGroup
  abstract: true
  id: MoffWardrobeOtherShoes
  loadouts: *OtherShoes

# Gathers every category above, plus the upstream loadouts listed below.
- type: loadoutGroup
  abstract: true
  parent:
  - MoffWardrobeColorShoes
  - MoffWardrobeCowboyBoots
  - MoffWardrobeNoveltySocks
  - MoffWardrobeOtherShoes
  id: MoffWardrobeShoes
  loadouts:
  - BlackShoes
  - WhiteShoes
  - BrownShoes
  - BlueShoes
  - CowboyShoes
  - BlackSandals
  - ClownSandals
  - WinterBoots
  - LaceupShoes
