# For ye who come to microbalance here:
# the upstream event scheduler does an event on average every 6.5 minutes
# This totals to around 14 events per round (assuming 90 minute rounds).
# This includes the calm ones being in their pile as well.
# Do the math before microbalancing these values.

- type: entity
  id: MoffCalmStationEventScheduler
  parent: BaseGameRule
  components:
  - type: MoffStationEventScheduler
    initialState: normal
    scheduledGameRules: !type:NestedSelector
      tableId: MoffCalmEventsTable
    states:
      normal:
        minMaxEventTiming:
          min: 300 # 5 min
          max: 900 # 15 min

- type: entity
  id: MoffSpicyStationEventScheduler
  parent: BaseGameRule
  components:
  - type: MoffStationEventScheduler
    initialState: lull
    scheduledGameRules: !type:NestedSelector
      tableId: MoffSpicyEventsTable
    states:
      lull: # Downtime between spicy events.
        duration:
          min: 900 # 15 min
          max: 1500 # 25 min
        nextStates:
          wave: 1
      wave:
        duration:
          min: 180 # 3 min
          max: 420 # 7 min
        minMaxEventTiming:
          min: 60 # 1 min
          max: 180 # 3 min
        nextStates:
          lull: 1
        eventOnEnd: true

- type: entity
  id: MoffSurvivalSpicyStationEventScheduler
  parent: BaseGameRule
  components:
  - type: MoffStationEventScheduler
    initialState: lull
    scheduledGameRules: !type:NestedSelector
      tableId: MoffSpicyEventsTable
    states:
      lull:
        duration:
          min: 900 # 15 min
          max: 1800 # 30 min
        nextStates:
          buildup: 1
      buildup:
        duration:
          min: 300 # 5 min
          max: 480 # 8 min
        minMaxEventTiming:
          min: 180 # 3 min
          max: 300 # 5 min
        nextStates:
          escalation: 1
      escalation:
        duration:
          min: 300 # 5 min
          max: 420 # 7 min
        minMaxEventTiming:
          min: 90 # 1.5 min
          max: 150 # 2.5 min
        nextStates:
          surge: 1
      surge:
        duration:
          min: 240 # 4 min
          max: 360 # 6 min
        minMaxEventTiming:
          min: 60 # 1 min
          max: 90 # 1.5 min
        nextStates:
          peak: 1
      peak: # Everything at once, then it breaks back down to lull.
        duration:
          min: 150 # 2.5 min
          max: 270 # 4.5 min
        minMaxEventTiming:
          min: 30 # 0.5 min
          max: 60 # 1 min
        nextStates:
          lull: 1
        eventOnEnd: true
