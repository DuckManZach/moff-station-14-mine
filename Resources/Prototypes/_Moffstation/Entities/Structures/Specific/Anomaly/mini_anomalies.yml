- type: entity
  id: RandomMiniRockAnomalySpawner
  name: random mini rock anomaly spawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Specific/anomaly.rsi
      state: anom6
  - type: RandomSpawner
    prototypes:
    - MiniAnomalyRockIron
    - MiniAnomalyRockCoal
    - MiniAnomalyRockSilver
    - MiniAnomalyRockGold
    - MiniAnomalyRockQuartz
    - MiniAnomalyRockUranium
