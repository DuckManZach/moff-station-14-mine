# Mini-anomalies: listed first in `parent` so these fields win over the full anomaly's.
- type: entity
  abstract: true
  id: BaseMiniAnomaly
  name: mini anomaly
  description: A small, flickering anomaly. It looks like it could fizzle out at any moment.
  components:
  - type: Anomaly
    minPointsPerSecond: 3
    maxPointsPerSecond: 18
    initialSeverityRange: [0.05, 0.2]
    initialStabilityRange: [0.45, 0.55]
    severityGrowthCoefficient: 0.02
    decayhreshold: 0.35
    healthChangePerSecond: -0.1
    corePrototype: EffectSparks
    coreInertPrototype: EffectSparks
  - type: Sprite
    scale: 0.5, 0.5
  - type: AmbientSound
    range: 3
    volume: -10
  - type: DamageOnInteract
    damage:
      types:
        Radiation: 3
    popupText: anomaly-component-contact-damage
  - type: DamageOnAttacked
    damage:
      types:
        Radiation: 3

- type: entity
  id: MiniAnomalyPyroclastic
  parent: [ BaseMiniAnomaly, AnomalyPyroclastic ]
  suffix: Mini, Pyroclastic
  components:
  - type: PyroclasticAnomaly
    maximumIgnitionRadius: 2
  - type: TempAffectingAnomaly
    tempChangePerSecond: 5
    hotspotExposeTemperature: 400
  - type: GasProducerAnomaly
    criticalMoleAmount: 30
    spawnRadius: 1
    tileCount: 1
    tempChange: 100
  - type: ProjectileAnomaly
    minProjectiles: 1
    maxProjectiles: 2
  - type: DamageOnInteract
    damage:
      types:
        Heat: 3
  - type: DamageOnAttacked
    damage:
      types:
        Heat: 3

- type: entity
  id: MiniAnomalyGravity
  parent: [ BaseMiniAnomaly, AnomalyGravity ]
  suffix: Mini, Gravity
  components:
  - type: GravityAnomaly
    maxGravityWellRange: 3
    maxThrowRange: 2
    maxThrowStrength: 3
    maxRadiationIntensity: 0.5
    maxAccel: 2
    maxRadialAccel: 2
    spaceRange: 1
  - type: GravityWell
    maxRange: 0.7
  - type: SingularityDistortion
    intensity: 100

- type: entity
  id: MiniAnomalyElectricity
  parent: [ BaseMiniAnomaly, AnomalyElectricity ]
  suffix: Mini, Electricity
  components:
  - type: ElectricityAnomaly
    minBoltCount: 1
    maxBoltCount: 2
    maxElectrocuteRange: 3
    maxElectrocuteDamage: 5
    maxElectrocuteDuration: 2
    passiveElectrocutionChance: 0.01
    empEnergyConsumption: 20000
    empDisabledDuration: 10
  - type: Electrified
    shockDamage: 2
    shockTime: 1

- type: entity
  id: MiniAnomalyFlesh
  parent: [ BaseMiniAnomaly, AnomalyFlesh ]
  suffix: Mini, Flesh
  components:
  - type: TileSpawnAnomaly
    entries:
    - settings:
        spawnOnPulse: true
        spawnOnStabilityChanged: true
        minAmount: 1
        maxAmount: 2
        maxRange: 2
      floor: FloorFlesh
    - settings:
        spawnOnSuperCritical: true
        minAmount: 3
        maxAmount: 6
        maxRange: 3
      floor: FloorFlesh
  - type: EntitySpawnAnomaly
    entries:
    - settings:
        spawnOnPulse: true
        maxAmount: 1
        minRange: 1.5
        maxRange: 2.5
      spawns:
      - FleshBlocker
    - settings:
        spawnOnSuperCritical: true
        minAmount: 2
        maxAmount: 4
        minRange: 2
        maxRange: 4
      spawns:
      - FleshBlocker
    - settings:
        spawnOnSuperCritical: true
        minAmount: 1
        maxAmount: 2
        maxRange: 3
      spawns:
      - MobFleshJared
      - MobFleshGolem
      - MobFleshClamp
      - MobFleshLover

- type: entity
