# injectionComponents replaces the parent's entirely, so each trap repeats the full mini Anomaly block.
- type: entity
  parent: AnomalyTrapPyroclastic
  id: MiniAnomalyTrapPyroclastic
  suffix: Mini, Pyroclastic
  components:
  - type: InnerBodyAnomalyInjector
    injectionComponents:
      - type: Anomaly
        deleteEntity: false
        minPointsPerSecond: 3
        maxPointsPerSecond: 25
        initialSeverityRange: [0.05, 0.2]
        initialStabilityRange: [0.45, 0.55]
        severityGrowthCoefficient: 0.02
        decayhreshold: 0.35
        healthChangePerSecond: -0.1
        corePrototype: EffectSparks
        coreInertPrototype: EffectSparks
        supercriticalSoundAtAnimationStart:
          collection: AnomalyPyroSupercritical
      - type: InnerBodyAnomaly
        injectionProto: MiniAnomalyInjectionPyroclastic
        stunDuration: 1.5
        startMessage: inner-anomaly-start-message-pyro
        fallbackSprite:
          sprite: Structures/Specific/Anomalies/inner_anom_layer.rsi
          state: fire
        speciesSprites:
          Vox:
            sprite: Structures/Specific/Anomalies/inner_anom_layer.rsi
            state: fire_VOX
          Arachnid:
            sprite: Structures/Specific/Anomalies/inner_anom_layer.rsi
            state: fire_ARACHNID
          Moth:
            sprite: Structures/Specific/Anomalies/inner_anom_layer.rsi
            state: fire_MOTH

